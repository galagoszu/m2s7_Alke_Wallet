<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Últimos Movimientos</title>

    <!-- Bootstrap                                 -->
    <!-- Se utiliza para construir una interfaz    -->
    <!-- responsiva y con un diseño moderno.       -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Hoja de estilos principal                 -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="container py-5">

    <!-- Encabezado                                -->
    <div class="text-center mb-4">

        <h1 class="logo">
            Alke Wallet
        </h1>

        <p class="text-muted">
            Historial de Movimientos
        </p>

    </div>

    <!-- ========================================= -->
    <!-- Tarjeta principal                         -->
    <!-- Aquí se mostrará la tabla con los         -->
    <!-- movimientos registrados en la Wallet.     -->
    <!-- ========================================= -->
    <div class="card shadow">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo</th>
                            <th>Contacto</th>
                            <th>Monto</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMovimientos">

                        <!-- =====================================
                            Las filas serán creadas dinámicamente
                            desde app.js utilizando JQuery.
                        ====================================== -->

                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Botón para regresar al menú               -->
    <div class="d-grid mt-4">
        <a
            href="menu.html"
            class="btn btn-secondary">
            Volver al Menú
        </a>
    </div>

</div>

<!-- JQuery -->
<!-- Debe cargarse antes de app.js              -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- JavaScript principal -->
<!-- Aquí estará toda la lógica del proyecto    -->
<script src="js/app.js"></script>

</body>

</html>
