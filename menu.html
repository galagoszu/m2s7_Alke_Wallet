<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Menú Principal</title>

    
    <!-- Bootstrap                                 -->
    <!-- Se utilizará para construir la interfaz responsive de la aplicación. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <!-- Hoja de estilos principal                 -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    
    <!-- Contenedor principal                      -->
    <div class="container py-5">
        
        <!-- Encabezado                               -->
        <div class="text-center mb-4">

            <h1 class="logo">
                Alke Wallet
            </h1>

            <p class="text-muted">
                Menú Principal
            </p>

        </div>

        
        <!-- Tarjeta de bienvenida                    -->
        <!-- El correo será cargado desde app.js      -->
        <div class="card shadow mb-4">

            <div class="card-body text-center">

                <h5>
                    Bienvenido
                </h5>

                <h4 id="nombreUsuario">
                    Cargando usuario...
                </h4>

            </div>

        </div>

        
        <!-- Tarjeta del saldo                        -->
        <!-- El saldo será actualizado desde app.js   -->
        <div class="card shadow mb-4 saldo-card">

            <div class="card-body text-center">

                <h5>
                    Saldo Disponible
                </h5>

                <h2 id="saldo">
                    $0
                </h2>

            </div>

        </div>

        
        <!-- Opciones principales                     -->
        <!-- Cada botón llevará a una pantalla        -->
        <!-- distinta del proyecto.                   -->
        <div class="d-grid gap-3">

            <a href="deposit.html"
                class="btn btn-success">
                Depositar
            </a>

            <a href="sendmoney.html"
                class="btn btn-warning">
                Enviar Dinero
            </a>

            <a href="transactions.html"
                class="btn btn-info text-white">
                Últimos Movimientos
            </a>

        </div>

        
        <!-- Botón cerrar sesión                      -->
        <!-- Será controlado desde app.js             -->
        <div class="d-grid mt-5">

            <button
                id="btnCerrarSesion"
                class="btn btn-danger">

                Cerrar Sesión

            </button>

        </div>

    </div>

    
    <!-- JQuery                                     -->
    <!-- Debe cargarse antes de app.js              -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    
    <!-- JavaScript principal                       -->
    <!-- Aquí estará toda la lógica del proyecto    -->
    <script src="js/app.js"></script>

</body>

</html>
