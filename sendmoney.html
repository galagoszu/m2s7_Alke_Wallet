<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alke Wallet | Enviar Dinero</title>

    <!-- Bootstrap                                 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Hoja de estilos principal                 -->
    <link rel="stylesheet"
          href="css/styles.css">

</head>

<body>

<div class="container py-5">

    <!-- Encabezado                                -->
    <div class="text-center mb-4">

        <h1 class="logo">
            Alke Wallet
        </h1>

        <p class="text-muted">
            Enviar Dinero
        </p>

    </div>

    <!-- Saldo disponible                          -->
    <!-- Será actualizado desde app.js             -->
    <div class="card shadow mb-4">

        <div class="card-body text-center">

            <h5>
                Saldo Disponible
            </h5>

            <h2 id="saldoEnviar">
                $0
            </h2>

        </div>

    </div>

    <!-- Formulario de envío                       -->

    <div class="card shadow">

        <div class="card-body">

            <form id="sendMoneyForm">

                <div class="mb-3">

                    <label class="form-label">
                        Contacto
                    </label>

                    <select
                        id="contacto"
                        class="form-select">
                    </select>

                </div>

                <div class="mb-3">

                    <button
                        type="button"
                        id="btnNuevoContacto"
                        class="btn btn-outline-primary w-100">
                        Agregar nuevo contacto
                    </button>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Monto a enviar
                    </label>

                    <input
                        type="number"
                        id="montoEnviar"
                        class="form-control"
                        min="1"
                        placeholder="Ejemplo: 15000"
                        required>

                </div>

                <!-- Mensajes -->
                <div id="mensajeEnviar"></div>

                <div class="d-grid mt-4">

                    <button
                        type="submit"
                        class="btn btn-warning">
                        Enviar Dinero
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Volver al menú                            -->

    <div class="d-grid mt-4">

        <a
            href="menu.html"
            class="btn btn-secondary">
            Volver al Menú
        </a>

    </div>

</div>

<!-- Modal Bootstrap para agregar contacto     -->
<div
    class="modal fade"
    id="modalContacto"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Nuevo Contacto
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="contactForm">

                    <div class="mb-3">

                        <label>
                            Nombre y Apellido
                        </label>

                        <input
                            type="text"
                            id="nombreContacto"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>
                            CBU
                        </label>

                        <input
                            type="text"
                            id="cbu"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>
                            Alias
                        </label>

                        <input
                            type="text"
                            id="alias"
                            class="form-control"
                            required>

                    </div>

                    <div class="mb-3">

                        <label>
                            Banco
                        </label>

                        <input
                            type="text"
                            id="banco"
                            class="form-control"
                            required>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Guardar Contacto
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

<!-- Jquery                                    -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap                                 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script principal de la aplicación         -->
<script src="js/app.js"></script>

</body>

</html>
