
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet | Depósitos</title>

    <!-- Bootstrap                                 -->
    <!-- Se utilizará para construir la interfaz responsive de la aplicación. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <!-- Hoja de estilos principal                 -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <div class="container py-5">

        <!-- Título de la pantalla                     -->
        <div class="text-center mb-4">

            <h1 class="logo">
                Alke Wallet
            </h1>

            <p class="text-muted">
                Realizar Depósito
            </p>

        </div>

        
        <!-- Tarjeta donde se mostrará el saldo        -->
        <!-- actualizado desde app.js                 -->
        <div class="card shadow mb-4">

            <div class="card-body text-center">

                <h5>
                    Saldo Actual
                </h5>

                <h2 id="saldoActual">
                    $0
                </h2>

            </div>

        </div>

        
        <!-- Formulario de depósito                    -->
        <div class="card shadow">

            <div class="card-body">

                <form id="depositForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Monto a depositar
                        </label>

                        <input
                            type="number"
                            id="montoDeposito"
                            class="form-control"
                            placeholder="Ejemplo: 20000"
                            min="1"
                            required>

                    </div>

                    <!-- Aquí mostraremos los mensajes -->
                    <div id="mensajeDeposito"></div>

                    <div class="d-grid mt-4">

                        <button
                            type="submit"
                            class="btn btn-success">
                            Realizar Depósito
                        </button>

                    </div>

                </form>

            </div>

        </div>

        
        <!-- Botón para volver al menú                 -->
        <div class="d-grid mt-4">

            <a
                href="menu.html"
                class="btn btn-secondary">
                Volver al Menú
            </a> 
            
        </div>

    </div>

    <!-- JQuery -->
    <!-- Debe cargarse antes de app.js              -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript principal -->
    <!-- Aquí estará toda la lógica del proyecto    -->
    <script src="js/app.js"></script>

</body>

</html>
